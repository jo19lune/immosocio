spring.application.name=immobiliersocial

# ==============================================================================
# Import du fichier .env
# ==============================================================================
spring.config.import=optional:file:.env[.properties]

# ==============================================================================
# Base de données PostgreSQL
# ==============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# ==============================================================================
# JPA / Hibernate
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}

# ==============================================================================
# Serveur
# ==============================================================================
server.port=${PORT}

# ==============================================================================
# JWT
# ==============================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# ==============================================================================
# Multipart — upload de photos
# ==============================================================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}

# ==============================================================================
# Mail (SMTP)
# ==============================================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================================================================
# Application — URL du frontend
# ==============================================================================
app.frontend.url=${FRONTEND_URL}

# ==============================================================================
# Stockage local des images
# ==============================================================================
app.upload.dir=${UPLOAD_DIR}
app.upload.base-url=${UPLOAD_BASE_URL}
