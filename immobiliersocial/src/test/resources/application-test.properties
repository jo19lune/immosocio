# ===========================
# Base de données H2 en mémoire (tests uniquement)
# ===========================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===========================
# Désactiver Google Drive pour les tests
# ===========================
app.google.drive.credentials-path=
app.google.drive.folder-id=test-folder
app.google.drive.application-name=ImmobilierSocialTest

# JWT
app.jwt.secret=TestSecretKey_AtLeast32Characters_ForTests!
app.jwt.expiration=3600000

# Mail (mock — non utilisé en test)
spring.mail.host=localhost
spring.mail.port=25
